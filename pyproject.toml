[project]
name = "mathy_pydoc"
description = "Minimal python API documentation generation for https://mathy.ai"
readme = "README.md"
license = "MIT"
requires-python = ">= 3.10"
authors = [
    { name = "Justin DuJardin", email = "justin@dujardinconsulting.com" },
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["markdown", "pydoc", "generator", "docs", "documentation"]
dependencies = [
    "typer>=0.3.0",
    "Markdown>=2.6.11",
]

[project.scripts]
mathy_pydoc = "mathy_pydoc.cli:app"

[project.urls]
Homepage = "https://github.com/mathy/mathy_pydoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "mypy>=1.8.0",
    "black>=22.3.0",
    "flake8>=4.0.0",
    "twine>=4.0.0",
    "python-semantic-release>=9.0.0",
]

[tool.hatch.version]
path = "mathy_pydoc/about.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["mathy_pydoc"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mathy_pydoc.*"
disallow_untyped_defs = true

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
commit_parser = "conventional"
version_variables = ["mathy_pydoc/about.py:__version__"]
major_on_zero = false
commit_message = "chore(release): {version}"
build_command = "rm -rf dist && uv build"

[tool.semantic_release.commit_parser_options]
minor_tags = []
patch_tags = ["feat", "fix", "perf"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
